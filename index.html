<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <!-- 网站基本信息 - 可在 src/branding.ts 中自定义 -->
    <title>%SITE_TITLE%</title>
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />
    <meta
      name="keywords"
      content="%SITE_KEYWORDS%"
    />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:site_name" content="%OG_SITE_NAME%" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="%OG_DESCRIPTION%"
    />
    <meta property="og:url" content="%OG_URL%" />
    <!-- Favicon 图标 - 可在 src/branding.ts 中自定义路径 -->
    <link rel="icon" href="/favicon.ico" />
    
    <!-- Critical First Screen CSS -->
    <style>
      /* Critical CSS for first paint */
      * {
        box-sizing: border-box;
      }
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>

  <body>
    <noscript>
      <h1>You need modern browsers to continue</h1>
      <h2>Your browser must support JavaScript and ES6</h2>
    </noscript>
    <script nomodule type="text/javascript">
      alert(
        "You need modern browsers to continue.\nYour browser must support JavaScript and ES6."
      );
    </script>
    
    <script type="text/javascript">
      (function() {
        if (!window.localStorage)
            alert(
            "Your browser must support window.localStorage and which must be enabled before accessing this site."
            );
      })();
    </script>

    <div id="app"></div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
